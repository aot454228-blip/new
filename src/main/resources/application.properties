# Cấu hình riêng từng máy nằm trong application-local.properties (không đẩy lên Git)
spring.config.import=optional:file:./application-local.properties
# App desktop: không chạy web server (không còn cổng 8080)
spring.main.web-application-type=none
spring.main.banner-mode=off

# SỬA Ở ĐÂY nếu SQL Server của bạn khác (tên server, user, mật khẩu)
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=HighlandsDB;encrypt=true;trustServerCertificate=true;loginTimeout=5
spring.datasource.username=sa
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
# SQL Server tắt thì báo lỗi sau 5 giây, không treo lâu
spring.datasource.hikari.connection-timeout=5000

# Chỉ kiểm tra schema; nâng cấp bằng migration SQL đã rà soát, không tự tạo bảng.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

logging.level.root=WARN

# Phân hệ khách hàng: tài khoản nhận tiền khi khách chọn chuyển khoản (đặt thật trong application-local.properties)
